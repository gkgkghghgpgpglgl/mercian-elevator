<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141619">
  <title>MERCIAN TOWER — Elevator</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,'Noto Sans KR',sans-serif;background:#08090b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:radial-gradient(ellipse at center,#24262a 0%,#101113 65%,#08090b);display:grid;place-items:center;overflow:hidden}
    .stage{position:relative;width:min(100vw,1500px,calc(100svh * 1672 / 941));aspect-ratio:1672 / 941;container-type:inline-size;overflow:hidden;background:#28292b url('assets/elevator.webp') center/100% 100% no-repeat;isolation:isolate;box-shadow:0 35px 130px #000c}
    .aperture{position:absolute;left:25.42%;top:10.63%;width:45.38%;height:89.37%;overflow:hidden;background:#25272b}
    .behind{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.82)}
    .door{position:absolute;top:0;height:100%;width:50%;object-fit:fill;z-index:2;transition:transform 1.15s cubic-bezier(.65,.02,.24,1);will-change:transform;filter:brightness(.96)}
    .door.left{left:0}.door.right{right:0}
    .stage.opening .door.left,.stage.open .door.left{transform:translateX(-100.5%)}
    .stage.opening .door.right,.stage.open .door.right{transform:translateX(100.5%)}
    .panel-mask{position:absolute;left:72.8%;top:33.3%;width:13.2%;height:59%;background:linear-gradient(90deg,#414143 0%,#37383b 22%,#303236 66%,#303133 100%);box-shadow:inset 1px 0 #ffffff1c,inset -1px 0 #0003;z-index:3}
    .panel-mask:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 10%,#ffffff0c 34%,transparent 58%,#0001);pointer-events:none}
    .indicator{position:absolute;z-index:4;left:73.17%;top:15.18%;width:7.43%;height:15.65%;border-radius:3px;background:linear-gradient(160deg,#111316,#090a0c);display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 0 1px #fff2,0 1px 1px #0008;color:#e6edf3}
    .direction{font-size:clamp(10px,2.5cqw,38px);line-height:1.1;opacity:.85;transition:opacity .2s}
    .floor-display{font-weight:300;font-size:clamp(14px,3.4cqw,50px);line-height:1.15;font-variant-numeric:tabular-nums}
    .indicator-sub{font-size:clamp(5px,.58cqw,9px);letter-spacing:.07em;color:#9fa4a8}
    .button-grid{position:absolute;z-index:5;left:74.04%;top:35.1%;width:10.36%;height:46%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));column-gap:.72cqw;row-gap:.32cqw;align-items:stretch;justify-items:center;padding:.45cqw .55cqw}
    button{font-family:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .floor-button{border:1px solid #7a7d8299;color:#eef0f1;background:linear-gradient(150deg,#484b4f 0%,#313337 42%,#25262a 100%);box-shadow:0 1px 2px #000b,inset 0 1px 1px #ffffff2e,inset 0 -2px 3px #0008;border-radius:5px;width:100%;height:100%;font-weight:400;font-size:clamp(9px,1.22cqw,18px);cursor:pointer;transition:background .12s,box-shadow .12s,transform .12s,color .12s}
    .floor-button:active,.floor-button.pressed{transform:scale(.92);background:linear-gradient(145deg,#9aa0a8,#50545b);box-shadow:0 0 10px #f4f9ff83,inset 0 0 3px #fff8;color:white}
    .floor-button.active{border-color:#f2f4f9;box-shadow:inset 0 0 5px #fbffff80,0 0 9px #f3f7ff9e;color:white}
    .door-controls{position:absolute;z-index:5;left:74.23%;top:83.5%;width:10.15%;height:5.4%;display:flex;gap:1.6cqw;justify-content:center}
    .door-controls button{width:38%;border-radius:5px;border:1px solid #787d8599;color:#eef2f7;background:linear-gradient(#3a3c3f,#202227);font-size:clamp(9px,1.4cqw,23px);cursor:pointer;box-shadow:inset 0 1px #ffffff2b}
    .door-controls button:active{background:#6d757d}
    .scene-full{position:absolute;inset:0;z-index:8;opacity:0;pointer-events:none;transition:opacity .5s ease;background:#0b0c0f}
    .scene-full img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
    .stage.scene-mode .scene-full{opacity:1;pointer-events:auto}
    .scene-full:before{content:"";position:absolute;inset:0 0 auto;height:17%;background:linear-gradient(#0008,transparent);pointer-events:none}
    .scene-info{position:absolute;left:clamp(16px,3%,55px);top:clamp(14px,3%,36px);font-size:clamp(13px,1.3cqw,20px);letter-spacing:.13em;font-weight:500;text-shadow:0 1px 9px #000;color:#f4f4f4}
    .close-scene{position:absolute;right:3%;bottom:5%;display:flex;align-items:center;gap:10px;padding:13px 23px;min-height:45px;border:1px solid #fff6;border-radius:8px;background:#101216c9;box-shadow:0 8px 26px #0007;backdrop-filter:blur(12px);color:#fff;font-size:clamp(13px,1.15cqw,17px);font-weight:600;cursor:pointer;transition:background .2s,transform .2s}
    .close-scene:hover{background:#282d33e5}.close-scene:active{transform:scale(.97)}
    .screen-reader-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media (max-width:660px){
      body{display:block;background:#101114}
      .stage{width:100vw;height:100svh;aspect-ratio:auto;background-size:auto 100%;background-position:53% 50%;box-shadow:none}
      .stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#191b1d 0%,transparent 18%,transparent 58%,#313338 64%,#34363a 100%);z-index:0}
      .aperture{left:3%;top:7%;width:59%;height:90%;border-left:2px solid #ffffff16;border-right:2px solid #ffffff12}
      .panel-mask{left:63%;top:0;width:37%;height:100%;background:linear-gradient(90deg,#44464a,#35373a 35%,#2b2d31 100%);z-index:3;border-left:1px solid #6668}
      .indicator{left:68%;top:9%;width:27%;height:14%;border-radius:4px}
      .direction{font-size:30px}.floor-display{font-size:37px}.indicator-sub{font-size:9px}
      .button-grid{left:65%;top:28%;width:33%;height:52%;column-gap:7px;row-gap:5px;padding:0 6px}
      .floor-button{font-size:13px;border-radius:6px}
      .door-controls{left:66%;top:83%;width:31%;height:6%;gap:10px}
      .door-controls button{font-size:22px;width:44%}
      .scene-info{font-size:15px}.close-scene{right:4%;bottom:5%;font-size:14px;padding:13px 18px}
      .scene-full img{object-fit:cover}
    }
    @media (prefers-reduced-motion:reduce){.door{transition-duration:.01ms}.scene-full{transition-duration:.01ms}}
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="메르시안 타워 엘리베이터">
    <div class="aperture" aria-hidden="true">
      <img class="behind" id="behind" src="assets/floor1.webp" alt="">
      <img class="door left" src="assets/door-left.webp" alt="">
      <img class="door right" src="assets/door-right.webp" alt="">
    </div>
    <div class="panel-mask" aria-hidden="true"></div>
    <div class="indicator" aria-live="polite" aria-label="현재 층">
      <div class="direction" id="direction">↑</div>
      <div class="floor-display" id="display">1</div>
      <div class="indicator-sub">MERCIAN</div>
    </div>
    <div class="button-grid" id="grid" role="group" aria-label="층 선택 버튼"></div>
    <div class="door-controls" aria-label="문 여닫기">
      <button type="button" id="openDoor" aria-label="문 열기" title="문 열기">◁▷</button>
      <button type="button" id="closeDoor" aria-label="문 닫기" title="문 닫기">▷◁</button>
    </div>
    <section class="scene-full" id="scene" aria-label="선택한 층">
      <img id="floorImage" src="assets/floor1.webp" alt="클럽 1층">
      <div class="scene-info" id="sceneTitle">01F</div>
      <button class="close-scene" id="closeScene" type="button"><span aria-hidden="true">▷◁</span> 문 닫기</button>
    </section>
    <span class="screen-reader-only" id="announcement" aria-live="polite"></span>
  </main>
  <script>
    (()=>{
      'use strict';
      const stage=document.getElementById('stage');
      const grid=document.getElementById('grid');
      const display=document.getElementById('display');
      const direction=document.getElementById('direction');
      const scene=document.getElementById('scene');
      const behind=document.getElementById('behind');
      const floorImage=document.getElementById('floorImage');
      const sceneTitle=document.getElementById('sceneTitle');
      const announcement=document.getElementById('announcement');
      const floors={
        1:{src:'assets/floor1.webp',alt:'메르시안 클럽 1층'},
        2:{src:'assets/floor2.webp',alt:'메르시안 클럽 2층 VIP룸'},
        5:{src:'assets/floor5.webp',alt:'VIP 복도'},
        7:{src:'assets/floor7.webp',alt:'VVIP 복도'},
        10:{src:'assets/floor10.webp',alt:'직원 사무실'},
        17:{src:'assets/floor17.webp',alt:'간부 회의실'},
        18:{src:'assets/floor18.webp',alt:'대표실 앞 복도'}
      };
      Object.values(floors).forEach(({src})=>{const image=new Image();image.src=src});
      let currentFloor=1;
      let selectedFloor=null;
      let busy=false;
      let sceneOpen=false;
      let phase='closed';
      let runningTimer=null;
      let timeouts=[];
      function delay(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}
      function clearTimers(){timeouts.forEach(clearTimeout);timeouts=[];if(runningTimer){clearInterval(runningTimer);runningTimer=null}}
      function setFloor(v){currentFloor=v;display.textContent=String(v)}
      function setLamp(floor,on){const b=grid.querySelector('[data-floor="'+floor+'"]');if(b)b.classList.toggle('active',on)}
      function press(b){b.classList.add('pressed');delay(()=>b.classList.remove('pressed'),240)}
      // Two columns, with every floor from 18 through 1 appearing exactly once.
      for(let n=18;n>=1;n--){
        const b=document.createElement('button');
        b.type='button';b.className='floor-button';b.textContent=String(n);
        b.dataset.floor=String(n);b.setAttribute('aria-label',n+'층');
        b.addEventListener('click',()=>chooseFloor(n,b));grid.appendChild(b);
      }
      function chooseFloor(n,b){
        if(busy||sceneOpen)return;
        press(b);
        // For floors without an assigned photo, deliberately do not change screens or indicator.
        if(!floors[n])return;
        busy=true;selectedFloor=n;setLamp(n,true);
        const dir=Math.sign(n-currentFloor);direction.textContent=dir>=0?'↑':'↓';
        if(dir===0){delay(()=>arrive(n),550);return}
        // Numeric display moves floor-by-floor, with a short but readable travel animation.
        delay(()=>{
          const distance=Math.abs(n-currentFloor);
          let hops=0;
          const ms=Math.max(68,Math.min(160,1000/distance));
          runningTimer=setInterval(()=>{
            setFloor(currentFloor+dir);
            hops++;
            if(currentFloor===n||hops>=distance){clearInterval(runningTimer);runningTimer=null;delay(()=>arrive(n),210)}
          },ms);
        },300);
      }
      function arrive(n){
        if(selectedFloor!==n)return;
        setFloor(n);direction.textContent='•';
        behind.src=floors[n].src;floorImage.src=floors[n].src;floorImage.alt=floors[n].alt;
        sceneTitle.textContent=String(n).padStart(2,'0')+'F';
        announcement.textContent=n+'층 도착. 문이 열립니다.';
        stage.classList.add('opening');phase='opening';
        delay(()=>{
          stage.classList.replace('opening','open');stage.classList.add('scene-mode');
          busy=false;sceneOpen=true;phase='open';setLamp(n,false);
        },1200);
      }
      function closeScene(){
        if(!sceneOpen||busy)return;
        busy=true;sceneOpen=false;phase='closing';
        stage.classList.remove('scene-mode');
        // Allow photo to recede before sliding steel doors back together.
        delay(()=>{
          stage.classList.remove('open','opening');
          direction.textContent='↑';
          delay(()=>{busy=false;selectedFloor=null;phase='closed';announcement.textContent='문이 닫혔습니다.'},1200);
        },360);
      }
      document.getElementById('closeScene').addEventListener('click',closeScene);
      document.getElementById('closeDoor').addEventListener('click',closeScene);
      document.getElementById('openDoor').addEventListener('click',()=>{
        if(busy||sceneOpen)return;
        const b=grid.querySelector('[data-floor="'+currentFloor+'"]');
        if(floors[currentFloor]&&b)chooseFloor(currentFloor,b);
      });
      document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sceneOpen)closeScene()});
    })();
  </script>
</body>
</html>
